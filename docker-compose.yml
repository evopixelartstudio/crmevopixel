version: '3.8'

services:
  crmevopixel:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:-}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY:-}
    container_name: crmevopixel
    restart: unless-stopped
    expose:
      - "3000"
    ports:
      # Somente loopback: acesso externo exclusivamente pelo proxy HTTPS.
      # Traefik usa a porta interna pela rede Docker compartilhada.
      - "127.0.0.1:${PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - CRM_ORIGIN=${CRM_ORIGIN:-https://crmevopixel.cloud}
      - CRM_ADMIN_EMAILS=${CRM_ADMIN_EMAILS-evopixelart@gmail.com}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL:-}
      - NEXT_PUBLIC_SUPABASE_ANON_KEY=${NEXT_PUBLIC_SUPABASE_ANON_KEY:-}
      - EVOLUTION_API_URL=${EVOLUTION_API_URL:-}
      - EVOLUTION_PROVIDER=${EVOLUTION_PROVIDER:-go}
      - EVOLUTION_API_KEY=${EVOLUTION_API_KEY:-}
      - EVOLUTION_INSTANCE=${EVOLUTION_INSTANCE:-evocrm}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY:-}
      - EVOLUTION_WEBHOOK_URL=${EVOLUTION_WEBHOOK_URL:-}
      - GOOGLE_CALENDAR_CLIENT_ID=${GOOGLE_CALENDAR_CLIENT_ID:-}
      - GOOGLE_CALENDAR_CLIENT_SECRET=${GOOGLE_CALENDAR_CLIENT_SECRET:-}
      - GOOGLE_CALENDAR_REDIRECT_URI=${GOOGLE_CALENDAR_REDIRECT_URI:-https://crmevopixel.cloud/api/agenda/callback}
      - GOOGLE_CALENDAR_ENCRYPTION_KEY=${GOOGLE_CALENDAR_ENCRYPTION_KEY:-}
    labels:
      - "traefik.enable=true"
      # Roteador HTTPS com certificado SSL Let's Encrypt
      - "traefik.http.routers.crmevopixel.rule=Host(`crmevopixel.cloud`)"
      - "traefik.http.routers.crmevopixel.entrypoints=websecure"
      - "traefik.http.routers.crmevopixel.tls=true"
      - "traefik.http.routers.crmevopixel.tls.certresolver=letsencrypt"
      # Encaminhamento do tráfego para a porta 3000 interna da aplicação
      - "traefik.http.services.crmevopixel.loadbalancer.server.port=3000"
      # Redirecionamento automático de HTTP (porta 80) para HTTPS (porta 443)
      - "traefik.http.routers.crmevopixel-http.rule=Host(`crmevopixel.cloud`)"
      - "traefik.http.routers.crmevopixel-http.entrypoints=web"
      - "traefik.http.routers.crmevopixel-http.middlewares=redirect-to-https"
      - "traefik.http.middlewares.redirect-to-https.redirectscheme.scheme=https"
    networks:
      - default
      - traefik_network

networks:
  default:
    name: crmevopixel_default
  traefik_network:
    name: ${TRAEFIK_NETWORK:-traefik_network}
    external: true
